<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .chat {
            max-width: 600px;
            height: 100vh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px;
            background: #222;
            color: white;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user {
            margin-left: auto;
            background: #d9fdd3;
        }

        .ai {
            margin-right: auto;
            background: #eeeeee;
        }

        .message.prose {
            white-space: pre-wrap;
        }

        .code-block {
            margin: 8px 0 0;
            overflow-x: auto;
            padding: 12px;
            border-radius: 8px;
            background: #1e1e1e;
            color: #f5f5f5;
            font: 13px/1.5 Consolas, "Courier New", monospace;
            white-space: pre;
        }

        .code-language {
            display: block;
            margin-bottom: 6px;
            color: #bdbdbd;
            font: 11px/1.2 Arial, sans-serif;
            text-transform: uppercase;
        }

        .input-area {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            border-top: 1px solid #ddd;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 20px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #record {
            background: #b3261e;
        }

        #record.recording {
            background: #087f5b;
        }

        audio {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="chat">

    <div class="header">
        My AI
    </div>

    <div id="messages"></div>

    <div class="input-area">
        <input
            id="input"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            Send
        </button>

        <button id="record" onclick="toggleRecording()" title="Record a voice message">
            Mic
        </button>
    </div>

</div>

<script>

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const recordButton = document.getElementById("record");
let conversation = [];
let mediaRecorder;
let audioChunks = [];

function addMessage(text, type) {
    const div = document.createElement("div");

    div.className = "message " + type;
    if (type === "ai") {
        renderAssistantMessage(div, text);
    } else {
        div.classList.add("prose");
        div.textContent = normalizeDisplayText(text);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function normalizeDisplayText(value) {
    return String(value ?? "")
        .replace(/\\r\\n/g, "\n")
        .replace(/\\n/g, "\n")
        .replace(/\\r/g, "\r")
        .replace(/\\t/g, "\t");
}

function renderAssistantMessage(container, value) {
    const text = normalizeDisplayText(value);
    const fencePattern = /```([^\n`]*)\r?\n([\s\S]*?)```/g;
    let cursor = 0;
    let match;
    let hasBlock = false;

    while ((match = fencePattern.exec(text))) {
        hasBlock = true;
        appendProse(container, text.slice(cursor, match.index));
        appendCodeBlock(container, match[2], match[1].trim());
        cursor = fencePattern.lastIndex;
    }

    if (hasBlock) {
        appendProse(container, text.slice(cursor));
    } else {
        appendProse(container, text);
    }
}

function appendProse(container, text) {
    if (!text) return;
    const prose = document.createElement("div");
    prose.className = "prose";
    prose.textContent = text;
    container.appendChild(prose);
}

function appendCodeBlock(container, code, language) {
    const pre = document.createElement("pre");
    pre.className = "code-block";

    if (language) {
        const label = document.createElement("span");
        label.className = "code-language";
        label.textContent = language;
        pre.appendChild(label);
    }

    const codeElement = document.createElement("code");
    codeElement.textContent = code.replace(/^\n|\n$/g, "");
    pre.appendChild(codeElement);
    container.appendChild(pre);
}

async function sendMessage(shouldSpeak = false) {

    const prompt = input.value.trim();

    if (!prompt) {
        return;
    }

    addMessage(prompt, "user");

    input.value = "";

    const thinkingMessage = document.createElement("div");
    thinkingMessage.className = "message ai";
    thinkingMessage.textContent = "Thinking...";
    messages.appendChild(thinkingMessage);
    messages.scrollTop = messages.scrollHeight;

    try {

        conversation.push({ role: "user", content: prompt });

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 90000);
        const response = await fetch("/api/chat", {
            method: "POST",
            signal: controller.signal,

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                messages: conversation,
                speak: shouldSpeak
            })
        });
        clearTimeout(timeout);

        const data = await response.json();

        thinkingMessage.remove();

        if (response.ok && data.response) {
            addMessage(data.response, "ai");
            conversation.push({ role: "assistant", content: data.response });
            if (shouldSpeak) {
                speakResponse(data.speechText, data.language);
            }
        } else {
            addMessage("AI error: " + (data.error || "No response received."), "ai");
        }

    } catch (error) {

        thinkingMessage.remove();

        addMessage(
            error.name === "AbortError"
                ? "The AI took too long to respond. Check that Ollama is running."
                : "Connection error: " + error.message,
            "ai"
        );
    }
}

async function toggleRecording() {
    if (mediaRecorder?.state === "recording") {
        mediaRecorder.stop();
        recordButton.textContent = "Mic";
        recordButton.classList.remove("recording");
        return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
    mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(track => track.stop());
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        const response = await fetch("/api/transcribe", {
            method: "POST",
            headers: { "Content-Type": "audio/webm" },
            body: blob
        });
        const data = await response.json();
        if (data.text) {
            input.value = data.text;
            sendMessage(true);
        } else if (data.error) {
            addMessage("Voice error: " + data.error, "ai");
        }
    };
    mediaRecorder.start();
    recordButton.textContent = "Stop";
    recordButton.classList.add("recording");
}

async function speakResponse(text, language) {
    if (!text) return;
    const response = await fetch("/api/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, language })
    });
    if (!response.ok) return;
    const audio = new Audio(URL.createObjectURL(await response.blob()));
    await audio.play().catch(() => {});
}

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
